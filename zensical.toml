[project]
site_url = "https://mikeyhogarth.github.io/tarot-ontology/"
site_name = "Tarot Ontology"
site_description = "An RDF ontology for tarot, plus data for the Rider-Waite-Smith, Marseille and Sola Busca decks, published as Linked Open Data."
site_author = "Mikey Hogarth"

copyright = """Data licensed <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · code MIT · card images public domain, via Wikimedia Commons. All built with ♥ by Mikey and Laura."""

repo_url = "https://github.com/mikeyhogarth/tarot-ontology"
repo_name = "mikeyhogarth/tarot-ontology"

watch = ["DEVELOPING.md"]

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Ontology" = "ontology.md" },
  { "Example decks" = "decks.md" },
  { "Describing cards" = [
    { "Symbology" = "symbol.md" },
    { "Interpretations" = "interpretation.md" },
    { "Correspondences" = "correspondence.md" },
    { "Adding your own correspondences" = "custom-correspondences.md" },
  ] },
  { "Development" = [
    { "Downloads" = "downloads.md" },
    { "Design Philosophy" = "design.md" },
    { "Working with this repository" = "development.md" },
    { "Contributing" = "contribution.md" },
  ] },
]

[project.plugins.include-markdown]

[project.theme]
favicon = "images/favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "material/pentagram"

[[project.theme.palette]]
primary = "deep-purple"
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
primary = "deep-purple"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
primary = "deep-purple"
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
